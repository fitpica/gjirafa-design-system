<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Data table visual fixture</title>
    <link rel="stylesheet" href="/docs/gjirafa-ds.css" />
    <style>
      body {
        margin: 0;
        padding: var(--gds-space-40);
        background: var(--gds-color-bg-primary);
        font-family: var(--gds-font-family-base);
      }
      #stage { display: flex; flex-direction: column; }
    </style>
  </head>
  <body>
    <!-- Static, deterministic fixture: no JS, no icon font, fixed data.
         Guards the header contrast (--table-header-color) and the toolbar
         overlay tokens (--table-toolbar-divider / --table-toolbar-btn-hover-bg). -->
    <main id="stage">
      <div class="gds-table__toolbar is-visible" data-testid="toolbar">
        <span class="gds-table__toolbar-count">2 selected</span>
        <div class="gds-table__toolbar-divider" aria-hidden="true"></div>
        <button type="button" class="gds-table__toolbar-btn">Export</button>
        <button type="button" class="gds-table__toolbar-btn">Archive</button>
        <button type="button" class="gds-table__toolbar-btn">Delete</button>
      </div>

      <div class="gds-table" data-testid="table">
        <table class="gds-table__table" aria-label="Orders">
          <thead class="gds-table__head">
            <tr class="gds-table__row">
              <th scope="col" class="gds-table__cell">Order</th>
              <th scope="col" class="gds-table__cell">Customer</th>
              <th scope="col" class="gds-table__cell">Date</th>
              <th scope="col" class="gds-table__cell">Status</th>
              <th scope="col" class="gds-table__cell">Total</th>
            </tr>
          </thead>
          <tbody class="gds-table__body">
            <tr class="gds-table__row gds-table__row--selected">
              <td class="gds-table__cell">#1001</td>
              <td class="gds-table__cell">Ada Lovelace</td>
              <td class="gds-table__cell">2026-06-01</td>
              <td class="gds-table__cell">Paid</td>
              <td class="gds-table__cell">€120.00</td>
            </tr>
            <tr class="gds-table__row gds-table__row--selected">
              <td class="gds-table__cell">#1002</td>
              <td class="gds-table__cell">Alan Turing</td>
              <td class="gds-table__cell">2026-06-02</td>
              <td class="gds-table__cell">Pending</td>
              <td class="gds-table__cell">€48.50</td>
            </tr>
            <tr class="gds-table__row">
              <td class="gds-table__cell">#1003</td>
              <td class="gds-table__cell">Grace Hopper</td>
              <td class="gds-table__cell">2026-06-03</td>
              <td class="gds-table__cell">Refunded</td>
              <td class="gds-table__cell">€9.99</td>
            </tr>
            <tr class="gds-table__row">
              <td class="gds-table__cell">#1004</td>
              <td class="gds-table__cell">Katherine Johnson</td>
              <td class="gds-table__cell">2026-06-04</td>
              <td class="gds-table__cell">Paid</td>
              <td class="gds-table__cell">€310.25</td>
            </tr>
          </tbody>
        </table>
      </div>
    </main>
  </body>
</html>
