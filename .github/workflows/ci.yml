name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Manual "Run workflow" button (Actions tab), for re-running main when a run gets stuck.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and contract checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      # Build regenerates docs/gjirafa-ds.css, tokens/*.json and the generated
      # parts of brand.md. If anything changes, a generated file was committed
      # out of date (or edited by hand).
      - name: Build
        run: npm run build
      - name: Generated files are committed and in sync
        run: |
          if ! git diff --exit-code; then
            echo "::error::Generated files are out of date. Run 'npm run build' locally and commit the result."
            exit 1
          fi

      - name: Tokens match the compiled CSS (DTCG)
        run: npm run test:tokens
      - name: Component contracts are valid and complete; examples pass lint
        run: npm run test:components
      - name: brand.md matches the contracts
        run: npm run test:brand
      - name: Claude Code plugin matches the GDS source
        run: npm run test:plugin
      - name: llms.txt and Markdown docs match the source
        run: npm run test:llms
      - name: Reference list page follows the contracts
        run: node scripts/components.mjs lint tests/visual/fixtures/list-page.html
      - name: Plugin and marketplace are valid
        run: npx --yes @anthropic-ai/claude-code@2.1.316 plugin validate .

  browser:
    name: Accessibility and visual tests
    # Visual baselines are macOS-Chromium screenshots (tests/visual/README.md),
    # so this job runs on macOS to compare like with like.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            packages/ds-core/package-lock.json
            packages/ds-vue/package-lock.json
      - run: npm ci
      # The Vue parity test mounts packages/ds-vue/dist, which links to ds-core.
      # Both are build output (not committed), so build them here.
      - name: Build ds-core and ds-vue
        run: |
          (cd packages/ds-core && npm ci && npm run build)
          (cd packages/ds-vue && npm ci && npm run build)
      - run: npx playwright install chromium
      - name: Accessibility (axe)
        run: npm run test:a11y
      - name: Visual regression
        run: npm run test:visual
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
